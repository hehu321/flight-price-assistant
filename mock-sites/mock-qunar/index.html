<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>去哪儿网 - 模拟首页表单</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="header">去哪儿旅行 Qunar (模拟平台)</div>
    <div class="container">
      <h2>机票搜索 (表单带入测试)</h2>
      <div class="form-group">
        <label>出发城市</label>
        <input type="text" data-qunar-input="origin" name="fromCity" placeholder="出发城市" />
      </div>
      <div class="form-group">
        <label>到达城市</label>
        <input type="text" data-qunar-input="destination" name="toCity" placeholder="到达城市" />
      </div>
      <div class="form-group">
        <label>出发日期</label>
        <input type="text" data-qunar-input="date" name="fromDate" value="2026-08-16" />
      </div>
      <button data-qunar-btn="search" id="qunarSearchBtn">立即搜索</button>
    </div>
    <script src="app.js"></script>
  </body>
</html>
