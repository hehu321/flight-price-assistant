<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>携程旅行机票 - 模拟首页</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="header">携程旅行 Ctrip (模拟平台)</div>
    <div class="container">
      <h2>机票查询</h2>
      <div class="form-group">
        <label>出发城市</label>
        <input type="text" data-ctrip-input="origin" placeholder="如：武汉" value="武汉" />
      </div>
      <div class="form-group">
        <label>到达城市</label>
        <input type="text" data-ctrip-input="destination" placeholder="如：北京" value="北京" />
      </div>
      <div class="form-group">
        <label>出发日期</label>
        <input type="text" data-ctrip-input="date" value="2026-08-16" />
      </div>
      <button data-ctrip-btn="search" id="searchBtn">搜索机票</button>
    </div>
    <script src="app.js"></script>
  </body>
</html>
